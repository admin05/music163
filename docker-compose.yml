services:
  netease-musician-task:
    build: .
    image: netease-musician-task:sqlite
    container_name: netease-musician-task
    restart: always
    volumes:
      - ./log:/app/log
      - ./data:/app/data
      - ./playwright_profiles:/app/playwright_profiles
      - ./debug:/app/debug
    environment:
      - TZ=Asia/Shanghai
      # SQLite 数据库路径，建议挂载 ./data 持久化
      - SQLITE_DB_PATH=/app/data/netease_music.db
      # 单账号配置；多账号可改用 NETEASE_ACCOUNTS JSON
      - NETEASE_PHONE=your-phone
      - NETEASE_PASSWORD=your-password
      # 每日任务执行时间（格式：HH:MM）
      - SEND_TIME=09:30
      # 间隔任务的执行间隔天数
      - EXECUTION_INTERVAL_DAYS=7
      # 每月最大发送次数限制
      - MAX_MONTHLY_SENDS=4
      # 登录方式
      - LOGIN_METHOD=playwright
      # 企业微信webhook密钥
      - WECOM_WEBHOOK_KEY=your-wecom-webhook-key
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
